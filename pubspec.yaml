name: my_flutter_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.1.3
  firebase_storage: ^12.2.1
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.2+8
  google_fonts: ^6.3.3
  just_audio: ^0.9.36
  flutter_tts: ^4.0.2
  livekit_client: ^2.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/licenses/
  fonts:
    - family: MafiaInter
      fonts:
        - asset: assets/fonts/Inter.ttf
